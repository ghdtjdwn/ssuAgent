name: CI

on:
  push:
    branches: [main]
    # Docs, archived manifests, automation config and env examples do not
    # change the runtime image.
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - '.github/**'
      - '.env.example'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quality (uv, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint and format check
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest

  docker-verify:
    name: Agent image verification (ARM64)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Build ARM64 image without push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: ssuagent:pr
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
      # A build alone passed with a runtime base image whose Python minor did not
      # match the builder venv (Dependabot #117). Importing the app inside the
      # built image catches that class of break before merge.
      - name: Smoke-run the built image
        run: |
          docker run --rm --platform linux/arm64 ssuagent:pr id -u
          docker run --rm --platform linux/arm64 ssuagent:pr python -c "import ssu_agent.main; print('import ok')"
          test "$(docker run --rm --platform linux/arm64 ssuagent:pr python -c 'from ssu_agent import config; print(config.BUILD_SHA)')" = "${{ github.event.pull_request.head.sha }}"

  docker:
    name: Agent image (GHCR, ARM64)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ghdtjdwn/ssuagent:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
